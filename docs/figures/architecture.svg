<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="sans-serif">
  <title>One decision: observation, interface, model, validator, executor, recorder</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1000" height="370" fill="#ffffff"/>

  <!-- Outer loop: an accepted action becomes the next observation -->
  <path d="M900,150 C900,30 100,30 100,150" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="50" text-anchor="middle" font-size="13" fill="#52514e">accepted: the action resolves, and the new state is observed</text>

  <!-- Inner loop: a refusal goes back with its reason -->
  <path d="M700,150 C700,60 300,60 300,150" fill="none" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="500" y="141" text-anchor="middle" font-size="13" fill="#b5461b">refused: a typed code and the reason, then try again</text>

  <!-- The five stages -->
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <rect x="20" y="150" width="160" height="90" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="100" y="180" font-size="15" font-weight="bold" fill="#0b0b0b">Observation</text>
    <text x="100" y="202">the game state, the same</text>
    <text x="100" y="219">in every condition</text>

    <rect x="220" y="150" width="160" height="90" rx="6" fill="#eaf2fb" stroke="#2a78d6" stroke-width="2"/>
    <text x="300" y="180" font-size="15" font-weight="bold" fill="#0b0b0b">Interface</text>
    <text x="300" y="202">the one thing varied:</text>
    <text x="300" y="219" font-weight="bold" fill="#1d5ea8">C1 · C2 · C2+M · C3</text>

    <rect x="420" y="150" width="160" height="90" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="500" y="180" font-size="15" font-weight="bold" fill="#0b0b0b">Model</text>
    <text x="500" y="202">proposes one action:</text>
    <text x="500" y="219">text, tool call or menu id</text>

    <rect x="620" y="150" width="160" height="90" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="700" y="180" font-size="15" font-weight="bold" fill="#0b0b0b">Validator</text>
    <text x="700" y="202">the engine's rules:</text>
    <text x="700" y="219">legal, or a typed refusal</text>

    <rect x="820" y="150" width="160" height="90" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5"/>
    <text x="900" y="180" font-size="15" font-weight="bold" fill="#0b0b0b">Executor</text>
    <text x="900" y="202">rolls and resolves,</text>
    <text x="900" y="219">from one seeded RNG</text>
  </g>

  <!-- Forward arrows -->
  <g stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="195" x2="218" y2="195"/>
    <line x1="380" y1="195" x2="418" y2="195"/>
    <line x1="580" y1="195" x2="618" y2="195"/>
    <line x1="780" y1="195" x2="818" y2="195"/>
  </g>

  <!-- Everything is recorded -->
  <g stroke="#c9c8c3" stroke-width="1.5" stroke-dasharray="2 4">
    <line x1="100" y1="240" x2="100" y2="300"/>
    <line x1="300" y1="240" x2="300" y2="300"/>
    <line x1="500" y1="240" x2="500" y2="300"/>
    <line x1="700" y1="240" x2="700" y2="300"/>
    <line x1="900" y1="240" x2="900" y2="300"/>
  </g>
  <rect x="20" y="300" width="960" height="56" rx="6" fill="#f4f3f0" stroke="#c9c8c3" stroke-width="1.5"/>
  <text x="500" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">Recorder</text>
  <text x="500" y="343" text-anchor="middle" font-size="12" fill="#52514e">every response, ruling and token count, with a state hash each turn: replaying the decisions reproduces the match exactly</text>
</svg>
