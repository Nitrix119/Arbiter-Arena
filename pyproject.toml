[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-arena"
version = "0.2.0"
description = "A deterministic evaluation harness for tool-using LLM agents, on an SRD 5.1-compatible combat engine"
readme = "README.md"
# Matches what CI actually tests (3.11 and 3.13). Claiming an older floor would
# be an unverified promise, and 3.9/3.10 buy nothing here — current cloud
# runtimes are on 3.11+.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Nitrix119" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black==26.5.1",  # pinned exactly: any drift rewraps the tree (see CLAUDE.md §9, 2026-08-29)
    # Linters pinned exactly, for the same reason as Black: a new release can add
    # a check and turn CI red on an unrelated change. Bump deliberately.
    "flake8==7.3.0",
    "mypy==2.3.1",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
# The LLM-backed arena agents. Optional: the engine and the headless arena (scripted
# agents, matches, transcripts) run without these. anthropic -> src/arena/llm_agent.py
# (Claude); openai -> src/arena/openrouter_agent.py (OpenRouter's OpenAI-compatible API).
agents = [
    "anthropic>=0.40.0",
    "openai>=1.0",
]

[project.urls]
homepage = "https://github.com/Nitrix119/arbiter-arena"

# Formatter/linter settings live here so every environment and CI agree.
# Black's default line length is 88; flake8 defaults to 79, and that mismatch
# was the source of ~460 phantom E501s. They are reconciled below.
[tool.black]
line-length = 88
target-version = ["py311", "py313"]
