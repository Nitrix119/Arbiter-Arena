[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-auto-battler"
version = "0.1.0"
description = "D&D 5e combat simulator for automated battles"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Nitrix119" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black==23.12.1",  # pinned: repo is formatted to Black's 2023 style; 24.0+ rewraps the whole tree
    "flake8>=6.0",
    "mypy>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
# The LLM-backed arena agents. Optional: the engine and the headless arena (scripted
# agents, matches, transcripts) run without these. anthropic -> src/arena/llm_agent.py
# (Claude); openai -> src/arena/openrouter_agent.py (OpenRouter's OpenAI-compatible API).
agents = [
    "anthropic>=0.40.0",
    "openai>=1.0",
]

[project.urls]
homepage = "https://github.com/Nitrix119/DnD-Auto-Battler"
