# Phase 2 pilot for Gemini 3.8 Flash: 1 model x 4 conditions x 4 scenarios x 2 seeds = 32
# matches (~$2 before reasoning). It measures real token use, including low-effort
# reasoning, and confirms the pinned host behaves as listed, before the final run's
# spend cap is set (prereg §11). The baselines already ran in results/pilot-2.
#
#   python -m src.arena.study run examples/study/pilot_gemini.toml --out results/pilot-gemini --dry-run
#   python -m src.arena.study run examples/study/pilot_gemini.toml --out results/pilot-gemini
#
# Live runs cost money: never start one without an explicit go-ahead.
# The pilot is not data (prereg §4.4); the final run uses seeds 101-110.

[study]
name = "pilot-gemini"
seeds = [1, 2]
scenarios = ["kiting", "alpha_strike", "protect_squishy", "aoe_placement"]
conditions = ["C1", "C2", "C2+M", "C3"]
opponent = "scripted"          # settled by the Nemotron pilot (prereg §4.4)
spend_cap_usd = 5.0           # a hard stop, recomputed from disk on every resume
max_attempts = 3
backoff_seconds = 30

[[models]]
id = "google/gemini-3.8-flash"
provider = "openrouter"
# The provider's default temperature, not sent and recorded as "default" (prereg §4).
temperature = "default"
usd_per_m_input = 0.75          # OpenRouter's listed price, checked 2026-09-30
usd_per_m_output = 3.75
# Google AI Studio, standard tier. Not Vertex (no temperature control) and not Flex
# (1-15 minute queueing targets and pre-emption, unsuited to a sequential loop).
hosts = ["google-ai-studio"]
max_tokens = 4096              # recorded; a response cut at this limit is flagged
# Reasoning is mandatory on this model; "low" is the lowest it allows (prereg §4).
reasoning = { effort = "low" }
