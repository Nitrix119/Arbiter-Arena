name: Replay site

# Publishes the match playback page to GitHub Pages, so readers can watch the
# featured matches (web/static/matches/featured.json) in the browser without
# cloning anything. The page is pure client-side and uses relative paths, so it is
# the same file FastAPI serves at /playback, copied as-is.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "web/templates/playback.html"
      - "web/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # lets you publish by hand from the Actions tab

# Only one deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp web/templates/playback.html _site/index.html
          cp -r web/static _site/static
          # Serve files as they are (no Jekyll processing of the static folder).
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
