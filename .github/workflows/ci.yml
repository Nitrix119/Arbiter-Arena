name: CI

# Runs on every push to main and on every pull request targeting it, so a
# regression is caught before it reaches main rather than after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every version's result, not just the first failure
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately NOT installing the [agents] extra. The engine and the
      # headless arena must run without anthropic/openai — those imports sit
      # behind guards, and this job is what proves the guards still work.
      - name: Install (core + web + dev, no optional agent deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Run tests
        run: pytest tests/ -q

  lint:
    name: format, lint, types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The [agents] extra IS installed here: mypy needs the real anthropic and
      # openai modules to resolve their imports, and would otherwise fail with
      # "cannot find implementation or library stub".
      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev,agents]"

      # Each check runs even if an earlier one failed, so one run tells you
      # everything that is wrong rather than only the first thing.
      - name: Black (formatting)
        if: always()
        run: black --check --diff src/ web/ tests/

      - name: Flake8 (lint, 88 chars enforced)
        if: always()
        run: flake8 src/ web/

      - name: Mypy (types)
        if: always()
        run: mypy src/
