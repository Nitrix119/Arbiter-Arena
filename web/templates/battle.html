<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle — Arbiter Arena</title>
    <link rel="stylesheet" href="/static/css/battle.css">
</head>
<body>
    <div id="turn-order-bar">
        <div id="turn-order-track"></div>
    </div>

    <canvas id="grid"></canvas>

    <div id="ws-status" class="ws-connecting" title="Connecting…"></div>

    <div id="measure-readout">0.00 ft</div>
    <div id="move-readout">0.0 / 30 ft</div>

    <div id="info-panel">
        <div class="info-title" id="info-name">Token</div>

        <div class="info-stat">
            <span class="info-label">HP</span>
            <span class="info-value" id="info-hp">—</span>
        </div>
        <div class="info-stat">
            <span class="info-label">AC</span>
            <span class="info-value" id="info-ac">—</span>
        </div>

        <div class="info-sep"></div>

        <div class="info-stat">
            <span class="info-label">Position</span>
            <span class="info-value" id="info-pos">—</span>
        </div>

        <div class="info-sep"></div>

        <div class="info-abilities">
            <div class="info-ability">
                <span class="info-label">STR</span>
                <span class="info-value" id="info-str">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">DEX</span>
                <span class="info-value" id="info-dex">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">CON</span>
                <span class="info-value" id="info-con">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">INT</span>
                <span class="info-value" id="info-int">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">WIS</span>
                <span class="info-value" id="info-wis">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">CHA</span>
                <span class="info-value" id="info-cha">—</span>
            </div>
        </div>
    </div>

    <div id="target-panel">
        <div class="info-title" id="tgt-name">Target</div>

        <div class="info-stat">
            <span class="info-label">HP</span>
            <span class="info-value" id="tgt-hp">—</span>
        </div>
        <div class="info-stat">
            <span class="info-label">AC</span>
            <span class="info-value" id="tgt-ac">—</span>
        </div>

        <div class="info-sep"></div>

        <div class="info-stat">
            <span class="info-label">Position</span>
            <span class="info-value" id="tgt-pos">—</span>
        </div>

        <div class="info-sep"></div>

        <div class="info-abilities">
            <div class="info-ability">
                <span class="info-label">STR</span>
                <span class="info-value" id="tgt-str">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">DEX</span>
                <span class="info-value" id="tgt-dex">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">CON</span>
                <span class="info-value" id="tgt-con">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">INT</span>
                <span class="info-value" id="tgt-int">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">WIS</span>
                <span class="info-value" id="tgt-wis">—</span>
            </div>
            <div class="info-ability">
                <span class="info-label">CHA</span>
                <span class="info-value" id="tgt-cha">—</span>
            </div>
        </div>
    </div>

    <div id="action-panel">
        <div class="action-panel-title" id="action-actor-name">—</div>
        <div class="action-list" id="action-list"></div>
    </div>

    <div id="targeting-banner">
        <span id="targeting-label">Targeting: —</span>
        <button id="targeting-cancel">Cancel</button>
    </div>

    <div id="toolbar">
        <button id="tool-move" class="tool-btn" title="move tool">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="white">
                <path d="M10 1L13 6H11V9H14V7L19 10L14 13V11H11V14H13L10 19L7 14H9V11H6V13L1 10L6 7V9H9V6H7L10 1Z"/>
            </svg>
        </button>
        <button id="tool-measure" class="tool-btn" title="measure">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
                <rect x="1" y="7" width="18" height="6" rx="1"/>
                <line x1="4"  y1="7" x2="4"  y2="10"/>
                <line x1="7"  y1="7" x2="7"  y2="9"/>
                <line x1="10" y1="7" x2="10" y2="10"/>
                <line x1="13" y1="7" x2="13" y2="9"/>
                <line x1="16" y1="7" x2="16" y2="10"/>
            </svg>
        </button>
        <button id="tool-info" class="tool-btn" title="info">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8.5" cy="8.5" r="5.5"/>
                <line x1="13" y1="13" x2="18.5" y2="18.5" stroke-width="2"/>
            </svg>
        </button>
        <button id="tool-action" class="tool-btn" title="action">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="white">
                <polygon points="11,1 4,11 10,11 9,19 16,9 10,9"/>
            </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button id="tool-add-token" class="tool-btn" title="add token">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                <line x1="10" y1="3" x2="10" y2="17"/>
                <line x1="3"  y1="10" x2="17" y2="10"/>
            </svg>
        </button>
        <div class="toolbar-sep"></div>
        <button id="btn-end-turn" class="end-turn-btn" title="End Turn">End Turn</button>
    </div>

    <div id="stat-breakdown-tooltip"></div>

    <div id="resource-panel"></div>

    <script type="module" src="/static/js/battle.js"></script>
</body>
</html>
